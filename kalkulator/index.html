<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Sederhana</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 30px;
    }

    .calculator {
      max-width: 300px;
      margin: 50px auto;
      background: white;
      border: 2px solid #000;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin: 0 0 20px;
      font-size: 24px;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    button {
      padding: 20px;
      font-size: 24px;
      border: 2px solid #000;
      background: white;
      cursor: pointer;
    }

    button:hover {
      background: #000;
      color: white;
    }

    .hasil {
      margin-top: 20px;
      min-height: 30px;
      font-size: 18px;
      border-bottom: 2px solid #000;
      padding-bottom: 5px;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <h1>Kalkulator</h1>

    <div class="buttons">
      <button>+</button>
      <button>-</button>
      <button>×</button>
      <button>÷</button>
    </div>

    <div class="hasil" id="hasil"></div>
  </div>

  <script>
    const tombol = document.querySelectorAll('button');
    const hasil = document.getElementById('hasil');

    tombol.forEach(function(button) {
      button.addEventListener('click', function() {
        const angka1 = Number(prompt('Masukkan angka pertama:'));
        const angka2 = Number(prompt('Masukkan angka kedua:'));

        if (isNaN(angka1) || isNaN(angka2)) {
          hasil.textContent = 'Input harus angka!';
          return;
        }

        const operasi = this.textContent;
        let jawaban = 0;

        if (operasi === '+') {
          jawaban = angka1 + angka2;
        } else if (operasi === '-') {
          jawaban = angka1 - angka2;
        } else if (operasi === '×') {
          jawaban = angka1 * angka2;
        } else if (operasi === '÷') {
          if (angka2 === 0) {
            hasil.textContent = 'Tidak bisa dibagi 0';
            return;
          }
          jawaban = angka1 / angka2;
        }

        hasil.textContent = angka1 + ' ' + operasi + ' ' + angka2 + ' = ' + jawaban;
      });
    });
  </script>
</body>
</html>
